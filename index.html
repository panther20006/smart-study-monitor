<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Study Monitor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="camera-container">

        <!-- CAMERA -->
        <video id="video"
               autoplay
               muted
               playsinline></video>

        <canvas id="canvas"></canvas>


        <!-- EYE RATIO -->
        <div class="eye-stats">

            <div class="eye-title">
                👁 EYE RATIO
            </div>

            <div class="eye-line">
                <span>Left</span>
                <strong id="leftEAR">--</strong>
            </div>

            <div class="eye-line">
                <span>Right</span>
                <strong id="rightEAR">--</strong>
            </div>

            <div class="eye-line average">
                <span>Average</span>
                <strong id="averageEAR">--</strong>
            </div>

            <div class="eye-status">
                <span>Status</span>
                <strong id="eyeStatus">WAITING</strong>
            </div>

        </div>


        <!-- LIVE -->
        <div class="live">
            <span></span>
            LIVE
        </div>


        <!-- SCAN LINE -->
        <div class="scan-line"></div>


        <!-- CORNERS -->
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>


        <!-- WARNING -->
        <div id="warning"
             class="warning">
        </div>


        <!-- CAMERA MESSAGE -->
        <div id="cameraMessage"
             class="camera-message">

            

        </div>


        <!-- START BUTTON -->
        <button id="startButton"
                class="start-button">

            START MONITOR

        </button>

    </main>


    <!-- =========================
         AUDIO
    ========================== -->

    <audio id="eyeAudio"
           preload="auto">

        <source src="audio/eye.mp3"
                type="audio/mp3">

    </audio>


    <audio id="phoneAudio"
           preload="auto">

        <source src="audio/phone.mp3"
                type="audio/mpeg">

    </audio>


    <!-- =========================
         MEDIAPIPE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>


    <!-- =========================
         TENSORFLOW
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>


    <!-- =========================
         COCO SSD
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>


    <!-- =========================
         MAIN JS
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
