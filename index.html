<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Study Monitor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="camera-container">

        <!-- CAMERA -->
        <video
            id="video"
            autoplay
            muted
            playsinline>
        </video>

        <!-- HIDDEN CANVAS -->
        <canvas id="canvas"></canvas>


        <!-- EYE RATIO -->
        <div class="eye-stats">

            <div class="eye-title">
                👁 EYE RATIO
            </div>

            <div class="eye-line">
                <span>Left</span>
                <strong id="leftEAR">--</strong>
            </div>

            <div class="eye-line">
                <span>Right</span>
                <strong id="rightEAR">--</strong>
            </div>

            <div class="eye-line average">
                <span>Average</span>
                <strong id="averageEAR">--</strong>
            </div>

            <div class="eye-status">
                <span>Status</span>
                <strong id="eyeStatus">WAITING</strong>
            </div>

        </div>


        <!-- LIVE -->
        <div class="live">
            <span></span>
            LIVE
        </div>


        <!-- SCAN -->
        <div class="scan-line"></div>


        <!-- CORNERS -->
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>


        <!-- WARNING -->
        <div id="warning" class="warning"></div>


        <!-- CAMERA MESSAGE -->
        <div id="cameraMessage" class="camera-message">
            Starting camera...
        </div>

    </main>


    <!-- AUDIO -->

    <audio id="eyeAudio" preload="auto">
        <source src="study/audio/eye.mp3" type="audio/mp3">
    </audio>
<!-- PHONE WARNING AUDIO -->
    <audio id="phoneAudio" preload="auto">
        <source src="study/audio/phone.mp3" type="audio/mp3">
    </audio>

    <!-- MEDIAPIPE -->

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>


    <!-- MAIN JS -->

    <script src="script.js"></script>

</body>

</html>
